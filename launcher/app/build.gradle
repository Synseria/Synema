plugins {
    id 'com.android.application'
}

/** What a git command prints, or {@code fallback} when it fails (no repository, no tag yet). */
def gitOut(List<String> args, String fallback) {
    try {
        def p = (['git'] + args).execute(null, rootDir)
        def out = p.text.trim()
        return p.waitFor() == 0 && out ? out : fallback
    } catch (Exception ignored) {
        return fallback
    }
}

android {
    namespace 'com.synseria.synema'
    compileSdk 34

    defaultConfig {
        applicationId 'com.synseria.synema'
        minSdk 28
        targetSdk 34
        // The version is the last tag (v3.0.0 → 3.0.0), the build number the count of commits: no file
        // to keep up to date. Outside git (a source archive) it is 0.0.0, build 1.
        versionCode gitOut(['rev-list', '--count', 'HEAD'], '1') as int
        versionName gitOut(['describe', '--tags', '--abbrev=0', '--match', 'v[0-9]*'], 'v0.0.0').replaceFirst('^v', '')
        // WebRTC's native code: ARM TVs only (this one is 32-bit), not the emulator ABIs.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Cameras full screen: WebRTC with go2rtc through Home Assistant's Frigate proxy (CameraRtc).
    implementation 'io.getstream:stream-webrtc-android:1.3.10'
}
